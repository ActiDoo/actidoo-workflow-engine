<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="484" viewBox="0 0 1200 484"><style>text{font-family:"72",Arial,Helvetica,sans-serif;fill:#1d2d3e;font-size:14px} .b{font-weight:700} .s{font-size:12.5px;fill:#556b82} .cap{font-size:13px;font-weight:700;fill:#556b82;letter-spacing:.04em}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d2d3e"/></marker></defs>
<rect width="1200" height="484" fill="#ffffff"/><rect x="300" y="36" width="540" height="178" rx="14" fill="none" stroke="#556b82" stroke-width="1.5" stroke-dasharray="7 5"/><text class="cap" x="316" y="60">ONE TRANSACTION</text><rect x="36" y="84" width="216" height="76" rx="10" fill="#ffffff" stroke="#a6a6a6" stroke-width="1.5"/><text class="b" x="144.0" y="118.0" text-anchor="middle">A workflow instance changes</text><text class="s" x="144.0" y="137.0" text-anchor="middle">for example a submitted task</text><line x1="252" y1="122" x2="318" y2="122" stroke="#1d2d3e" stroke-width="1.6" marker-end="url(#ah)" /><rect x="320" y="84" width="230" height="76" rx="10" fill="#eaf1f8" stroke="#5b738b" stroke-width="1.5"/><text class="b" x="435.0" y="109.0" text-anchor="middle">The engine saves the change</text><text class="s" x="435.0" y="128.0" text-anchor="middle">in its tables:</text><text class="s" x="435.0" y="145.0" text-anchor="middle">workflow instances and tasks</text><line x1="550" y1="122" x2="588" y2="122" stroke="#1d2d3e" stroke-width="1.6" marker-end="url(#ah)" /><rect x="590" y="84" width="232" height="76" rx="10" fill="#eaf3e6" stroke="#2e8400" stroke-width="1.5"/><text class="b" x="706.0" y="109.0" text-anchor="middle">The projection derives rows</text><text class="s" x="706.0" y="128.0" text-anchor="middle">in derived tables:</text><text class="s" x="706.0" y="145.0" text-anchor="middle">business data in columns</text><text class="s" x="570" y="196" text-anchor="middle">If the projection fails, nothing is stored.</text><rect x="900" y="84" width="264" height="76" rx="10" fill="#ffffff" stroke="#a6a6a6" stroke-width="1.5"/><text class="b" x="1032.0" y="118.0" text-anchor="middle">Rebuild in the background</text><text class="s" x="1032.0" y="137.0" text-anchor="middle">after a projection was added or changed</text><line x1="900" y1="122" x2="824" y2="122" stroke="#1d2d3e" stroke-width="1.6" marker-end="url(#ah)" /><text class="s" x="1032" y="184" text-anchor="middle">Runs the projection again for all</text><text class="s" x="1032" y="201" text-anchor="middle">existing workflow instances.</text><text class="cap" x="36" y="268">READING</text><line x1="36" y1="280" x2="1164" y2="280" stroke="#d9d9d9"/><line x1="435" y1="160" x2="435" y2="318" stroke="#1d2d3e" stroke-width="1.6" marker-end="url(#ah)" /><line x1="706" y1="160" x2="706" y2="318" stroke="#1d2d3e" stroke-width="1.6" marker-end="url(#ah)" /><rect x="320" y="320" width="230" height="76" rx="10" fill="#eaf1f8" stroke="#5b738b" stroke-width="1.5"/><text class="b" x="435.0" y="345.0" text-anchor="middle">Workflow views</text><text class="s" x="435.0" y="364.0" text-anchor="middle">database views with stable columns:</text><text class="s" x="435.0" y="381.0" text-anchor="middle">status, user tasks, who, when</text><line x1="550" y1="358" x2="588" y2="358" stroke="#1d2d3e" stroke-width="1.6" marker-end="url(#ah)" /><rect x="590" y="320" width="232" height="76" rx="10" fill="#eaf3e6" stroke="#2e8400" stroke-width="1.5"/><text class="b" x="706.0" y="354.0" text-anchor="middle">Data source</text><text class="s" x="706.0" y="373.0" text-anchor="middle">the rows a user may see</text><line x1="822" y1="358" x2="898" y2="358" stroke="#1d2d3e" stroke-width="1.6" marker-end="url(#ah)" /><rect x="900" y="320" width="264" height="76" rx="10" fill="#ffffff" stroke="#a6a6a6" stroke-width="1.5"/><text class="b" x="1032.0" y="354.0" text-anchor="middle">Page</text><text class="s" x="1032.0" y="373.0" text-anchor="middle">tables, key figures, charts</text><text class="s" x="706" y="422" text-anchor="middle">Totals per month or year are computed here, not stored.</text><rect x="36" y="446" width="16" height="16" rx="4" fill="#eaf1f8" stroke="#5b738b"/><text class="s" x="60" y="459">owned by the engine</text><rect x="210" y="446" width="16" height="16" rx="4" fill="#eaf3e6" stroke="#2e8400"/><text class="s" x="234" y="459">owned by the extension</text></svg>
